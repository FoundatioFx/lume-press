name: CI

on:
  push:
  workflow_call:

jobs:
  check:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Build Reason
        run: "echo ref: ${{ github.ref }} event: ${{ github.event_name }}"

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: "24"
          cache: true

      - name: Build Version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version=$(node -p "require('./package.json').version")
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "### Version: $version" >> "$GITHUB_STEP_SUMMARY"

      - name: Check
        run: vp check --deny-warnings

      - name: Tests
        run: vp test run

      - name: Build VitePress Reference
        run: vp run vitepress:build

      - name: Pack
        run: vp pm pack --out package.tgz

  npm:
    runs-on: ubuntu-24.04
    needs: check
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: "24"
          cache: true
          registry-url: "https://registry.npmjs.org"
          scope: "@foundatiofx"

      - name: Set Package Version
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          node -e 'const fs = require("node:fs"); const pkg = JSON.parse(fs.readFileSync("package.json", "utf8")); pkg.version = process.env.VERSION; fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2) + "\n");'

      - name: Pack Release Package
        run: vp pm pack --out package.tgz

      - name: Publish Release Package
        run: npm publish package.tgz --provenance --access public
